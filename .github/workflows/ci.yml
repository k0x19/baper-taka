name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - arena/86840354-baper-taka

# The workflow only reads source and runs local checks. No secrets are used.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
        env:
          CI: true
